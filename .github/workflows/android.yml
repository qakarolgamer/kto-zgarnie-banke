name: Android (APK)
on:
  push:
    branches: [main]
  workflow_dispatch:
# Najmniejsze możliwe uprawnienia: automat tylko czyta kod.
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Akcje przypięte do konkretnych commitów (SHA), żeby nikt nie podmienił ich kodu pod tagiem.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - name: Złóż grę
        run: python3 build.py
      - name: Zainstaluj zależności (dokładnie z package-lock, bez skryptów instalacyjnych)
        run: npm ci --ignore-scripts
      - name: Wygeneruj projekt Androida
        run: |
          npx --no-install cap add android
          npx --no-install cap sync android
      - name: Zbuduj APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kto-zgarnie-banke-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
