<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kto zgarnie Bańkę?</title>
<meta name="theme-color" content="#160b45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bańka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07051a;--v:#7c3aed;--c:#22d3ee;--p:#f472b6;--g:#fbbf24;--ok:#22c55e;--bad:#ef4444;--txt:#f5f3ff;--mut:#a5a3c9;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.13)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{margin:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--txt);background:var(--bg);overscroll-behavior:none;min-height:100vh;
  background:radial-gradient(120% 55% at 50% -10%,#3b1c8f 0%,#160b45 42%,var(--bg) 78%) fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{max-width:560px;margin:0 auto;padding:10px 12px 26px;display:flex;flex-direction:column;gap:10px}

/* top */
.topbar{display:none;justify-content:space-between;align-items:center;gap:8px}
.app.playing .topbar{display:flex}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;backdrop-filter:blur(10px);color:var(--txt)}
.chip b{color:var(--g)}
button.chip{cursor:pointer}
.title{font-family:Unbounded,sans-serif;font-weight:800;text-align:center;font-size:clamp(30px,9.5vw,50px);line-height:1.02;margin:8px 0 2px;
  background:linear-gradient(90deg,#fde68a,#fbbf24,#f472b6,#a78bfa,#22d3ee,#fde68a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 7s linear infinite;filter:drop-shadow(0 6px 24px rgba(244,114,182,.35))}
@keyframes shine{to{background-position:300% 0}}
.tag{text-align:center;color:var(--mut);margin:0 0 4px;font-size:14px}
.app.playing .title,.app.playing .tag{display:none}

/* stage */
.stage{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 22px 50px rgba(0,0,0,.55),0 0 0 1px rgba(124,58,237,.25),0 0 40px rgba(124,58,237,.25)}
.stage svg{display:block;width:100%;height:auto}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;transition:box-shadow .35s}
.stage.red::after{box-shadow:inset 0 0 70px 18px rgba(239,68,68,.85)}
.stage.gold::after{box-shadow:inset 0 0 70px 18px rgba(251,191,36,.75)}
.stage.shake{animation:shk .5s}
@keyframes shk{20%{transform:translate(-7px,2px)}40%{transform:translate(7px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,0)}}

#scene *{transform-box:fill-box;transform-origin:center}
#scene .beam{transform-box:view-box}
.b1{transform-origin:70px -20px;animation:sweep 7s ease-in-out infinite alternate}
.b2{transform-origin:330px -20px;animation:sweep 8.5s ease-in-out infinite alternate-reverse}
@keyframes sweep{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.bulb{animation:tw 1.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
.ring{animation:ringp 2.6s ease-in-out infinite}
.r2{animation-delay:-1.3s}
@keyframes ringp{50%{transform:scale(1.1);opacity:.35}}
.holo{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px)}}
.neon{animation:neon 2s ease-in-out infinite alternate}
@keyframes neon{from{opacity:.55}to{opacity:1}}

#host{animation:inL 1s cubic-bezier(.2,.9,.3,1.15) both}
#player{animation:inR 1s .15s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes inL{from{transform:translateX(-140px)}}
@keyframes inR{from{transform:translateX(140px)}}
.breath{animation:breath 3.6s ease-in-out infinite}
.bob{animation:breath 3s ease-in-out infinite}
@keyframes breath{50%{transform:translateY(-1.6px)}}
.eyes,.peyes{animation:blink 4.6s infinite}
.peyes{animation-delay:-2s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}

/* host moods */
.brL,.brR,.pbrL,.pbrR,.armL,.armR,.phead,.mouth{transition:transform .3s}
.face,.pface{transition:fill .3s}
#host.talking .mouth{animation:talk .13s infinite alternate}
@keyframes talk{from{transform:scaleY(.5)}to{transform:scaleY(2.6)}}
#host.talking .head{animation:nod .7s ease-in-out infinite}
@keyframes nod{50%{transform:rotate(-2.5deg)}}
.harm{transform-origin:0% 30%}
#host.reading .harm{animation:lift 1s ease-in-out}
@keyframes lift{35%,65%{transform:rotate(-22deg) translateY(-6px)}}
.blush,.steam{opacity:0;transition:opacity .3s}
#host[data-mood=mad] .face{fill:#f8a5a5}
#host[data-mood=mad] .blush{opacity:.75}
#host[data-mood=mad] .brL{transform:rotate(18deg) translateY(2px)}
#host[data-mood=mad] .brR{transform:rotate(-18deg) translateY(2px)}
#host[data-mood=mad] .steam{opacity:1}
#host[data-mood=mad] .steam circle{animation:steam 1s ease-out infinite}
#host[data-mood=mad] .steam circle:nth-child(2){animation-delay:.3s}
#host[data-mood=mad] .steam circle:nth-child(3){animation-delay:.6s}
@keyframes steam{from{transform:translateY(4px) scale(.6);opacity:1}to{transform:translateY(-12px) scale(1.4);opacity:0}}
#host[data-mood=mad] .head{animation:shk .45s}
#host[data-mood=smug] .brR{transform:translateY(-4px) rotate(-10deg)}
#host[data-mood=smug] .mouth{transform:scaleX(1.6)}
#host[data-mood=shock] .brL,#host[data-mood=shock] .brR{transform:translateY(-5px)}
#host[data-mood=shock] .mouth{transform:scale(1.4,3.2)}
#host[data-mood=laugh] .head{animation:laugh .25s infinite}
#host[data-mood=laugh] .mouth{transform:scale(1.8,3)}
@keyframes laugh{50%{transform:translateY(-2px) rotate(3deg)}}

/* player states */
.m-sad,.m-cheer,.m-worry,.sweat,.think{opacity:0;transition:opacity .2s}
.armL{transform-origin:100% 0%}
.armR{transform-origin:0% 0%}
#player[data-s=think] .think{opacity:1;animation:float 1s ease-in-out infinite}
#player[data-s=think] .pp{transform:translate(1px,-1.6px)}
#player[data-s=sweat] .m-idle{opacity:0}
#player[data-s=sweat] .m-worry{opacity:1}
#player[data-s=sweat] .sweat{opacity:1;animation:drip 1.1s ease-in infinite}
#player[data-s=sweat] .phead{animation:jit .12s infinite}
@keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
@keyframes jit{50%{transform:translateX(.8px)}}
#player[data-s=cheer] .m-idle{opacity:0}
#player[data-s=cheer] .m-cheer{opacity:1}
#player[data-s=cheer] .armL{transform:rotate(150deg)}
#player[data-s=cheer] .armR{transform:rotate(-150deg)}
#player[data-s=cheer] .bob{animation:jump .45s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-6px)}}
#player[data-s=sad] .m-idle{opacity:0}
#player[data-s=sad] .m-sad{opacity:1}
#player[data-s=sad] .phead{transform:translateY(5px) rotate(-7deg)}
#player[data-s=sad] .pbrL{transform:rotate(-16deg)}
#player[data-s=sad] .pbrR{transform:rotate(16deg)}
#player[data-s=sad] .pface{fill:#c9d6b8}

#dimmer{opacity:0;transition:opacity .5s}
#spotP{opacity:0;transition:opacity .5s}
.susp #dimmer{opacity:.6}
.susp #spotP{opacity:1}

/* bubble */
.bubble{position:relative;background:#fff;color:#1b1340;border-radius:18px;padding:10px 14px 12px;font-weight:600;line-height:1.38;min-height:64px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);margin-top:4px;transition:background .3s}
.bubble::before{content:"";position:absolute;top:-10px;left:20%;border:11px solid transparent;border-bottom-color:#fff;border-top:0;transition:border-color .3s}
.bubble small{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--v);font-weight:800;margin-bottom:2px}
.bubble.mad{background:#ffe1e1}
.bubble.mad::before{border-bottom-color:#ffe1e1}
.bubble.mad small{color:#dc2626}
.caret::after{content:"▍";color:var(--v);animation:cb .6s infinite}
@keyframes cb{50%{opacity:0}}

/* lifelines */
.lifelines{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px;border-radius:20px;background:rgba(7,5,26,.45);border:1px solid var(--line)}
.ll{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 2px 8px;border-radius:15px;border:1px solid transparent;
  background:transparent;color:var(--txt);cursor:pointer;transition:background .2s,border-color .2s,transform .15s,opacity .3s}
.ll .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:var(--a);
  background:color-mix(in srgb,var(--a) 14%,transparent);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--a) 22%,transparent),inset 0 1px 0 rgba(255,255,255,.08);transition:all .25s}
.ll .ic svg{width:21px;height:21px}
.ll .lt{font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:#d8d4f5}
.ll:not(:disabled):active{transform:scale(.94);background:rgba(255,255,255,.06)}
@media(hover:hover){.ll:not(:disabled):hover{background:rgba(255,255,255,.05);border-color:var(--line)}.ll:not(:disabled):hover .ic{transform:translateY(-2px)}}
.ll:disabled{cursor:default}
.ll:disabled .ic{color:#5d5a80;background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.08);box-shadow:none;position:relative}
.ll:disabled .ic::after{content:"";position:absolute;width:2px;height:46px;background:#ef4444;border-radius:2px;transform:rotate(45deg);box-shadow:0 0 8px rgba(239,68,68,.6)}
.ll:disabled .lt{color:#5d5a80;text-decoration:line-through}
/* question */
.qcard{position:relative;padding:14px 16px 16px;text-align:center;font-weight:800;font-size:clamp(16px,4.6vw,20px);line-height:1.3;border-radius:20px;
  background:linear-gradient(180deg,rgba(124,58,237,.45),rgba(30,18,90,.75));border:1px solid rgba(167,139,250,.55);
  box-shadow:0 0 34px rgba(124,58,237,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.qcard .lvl{display:inline-block;font-size:10.5px;letter-spacing:1.3px;font-weight:800;color:#1b1340;background:linear-gradient(90deg,#fde68a,#fbbf24);
  padding:4px 10px;border-radius:999px;margin-bottom:8px;text-transform:uppercase}
.qcard.enter{animation:fly .8s cubic-bezier(.2,.9,.3,1.15)}
@keyframes fly{0%{transform:translate(-30%,-160px) scale(.15) rotate(-16deg);opacity:0}50%{opacity:1}100%{transform:none}}
.answers{display:grid;gap:9px}
.ans{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 13px;border-radius:16px;border:1px solid var(--line);background:var(--glass);
  color:var(--txt);font-weight:600;font-size:15.5px;line-height:1.25;cursor:pointer;backdrop-filter:blur(10px);
  animation:ansIn .45s cubic-bezier(.2,.9,.3,1.2) backwards;transition:background .25s,border-color .25s,transform .12s}
.ans:active{transform:scale(.98)}
@keyframes ansIn{from{opacity:0;transform:translateX(-24px)}}
.ans .k{flex:0 0 32px;height:32px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:rgba(255,255,255,.1);color:var(--g);font-family:Unbounded,sans-serif;font-size:13px}
.ans.sel{background:linear-gradient(135deg,#fbbf24,#f97316);border-color:#fde68a;color:#1a0f00;animation:pulse .9s ease-in-out infinite}
.ans.sel .k{background:rgba(0,0,0,.15);color:#1a0f00}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(251,191,36,.25)}}
.ans.ok{background:linear-gradient(135deg,#15803d,#22c55e);border-color:#bbf7d0;color:#fff;animation:okp .3s 3}
.ans.ok .k{background:rgba(255,255,255,.2);color:#fff}
@keyframes okp{50%{transform:scale(1.03);filter:brightness(1.3)}}
.ans.bad{background:linear-gradient(135deg,#991b1b,#ef4444);border-color:#fecaca;color:#fff;animation:shk .45s}
.ans.bad .k{background:rgba(255,255,255,.2);color:#fff}
.ans.gone{animation:gone .4s forwards;pointer-events:none}
@keyframes gone{to{opacity:0;transform:scale(.9);filter:blur(4px)}}
.ans:disabled{cursor:default}
.fact{background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(244,114,182,.1));border:1px solid rgba(251,191,36,.45);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.45;animation:ansIn .4s}
.fact b{color:#fde68a}

/* buttons */
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:15px 22px;font-weight:800;font-size:16px;color:#1b1340;cursor:pointer;
  background:linear-gradient(135deg,#fde68a,#fbbf24 50%,#f59e0b);box-shadow:0 10px 26px rgba(251,191,36,.35);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.wide{width:100%}
.btn.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 10px 40px rgba(251,191,36,.7)}}
.btn.ghost{background:var(--glass);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff;box-shadow:0 10px 26px rgba(239,68,68,.35)}

/* start */
.screen{display:none;flex-direction:column;gap:10px}
.screen.on{display:flex}
.rules{list-style:none;margin:0;padding:12px 14px;background:var(--glass);border:1px solid var(--line);border-radius:18px;font-size:14.5px;line-height:1.4;display:grid;gap:7px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules li span{flex:0 0 auto}
.switch{display:flex;align-items:center}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked{background:linear-gradient(135deg,var(--v),var(--c))}
.switch input:checked::after{transform:translateX(20px)}

/* end */
.big{font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(40px,13vw,72px);text-align:center;margin:0;line-height:1;
  background:linear-gradient(180deg,#fff7cc,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 22px rgba(251,191,36,.45))}
.endh{font-family:Unbounded,sans-serif;font-weight:800;text-align:center;font-size:24px;margin:4px 0 0}
.mut{color:var(--mut);text-align:center;margin:0}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,3,20,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-bg.open{display:flex}
.sheet{width:100%;max-width:560px;background:linear-gradient(180deg,#24166e,#0f0933);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;
  padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;animation:up .38s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow:auto}
.sheet::before{content:"";align-self:center;width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25)}
@keyframes up{from{transform:translateY(100%)}}
.sheet h2{margin:0;font-family:Unbounded,sans-serif;font-size:20px}
.sheet p{margin:0;line-height:1.45}

/* phone call */
.call{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.cav{position:relative;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#f97316,#f472b6)}
.cav::before,.cav::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #f472b6;animation:ripple 1.6s ease-out infinite}
.cav::after{animation-delay:.8s}
.cav.live::before,.cav.live::after{animation:none;opacity:0}
@keyframes ripple{to{transform:scale(1.7);opacity:0}}
.cname{font-family:Unbounded,sans-serif;font-weight:800;font-size:20px;margin-top:8px}
.cst{color:var(--mut);font-variant-numeric:tabular-nums}
.csay{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px;line-height:1.45;text-align:left;min-height:20px;width:100%}
.csay:empty{display:none}
.hang{width:64px;height:64px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 8px 24px rgba(239,68,68,.45)}
.hang span{display:inline-block;transform:rotate(135deg)}

/* babcie */
.bars{display:flex;gap:10px;align-items:flex-end;height:250px;padding:6px 2px 0;border-radius:18px;background:radial-gradient(80% 60% at 50% 100%,rgba(244,114,182,.18),transparent)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bcol .pc{font-family:Unbounded,sans-serif;font-weight:800;font-size:15px;margin-bottom:2px;opacity:0;transition:opacity .3s}
.bcol.go .pc{opacity:1}
.gma{width:100%;max-width:66px;height:auto;display:block;margin-bottom:-6px;position:relative;z-index:1;animation:gbob 1.6s ease-in-out infinite;transform-origin:50% 100%}
.gma *{transform-box:fill-box}
@keyframes gbob{50%{transform:translateY(-3px) rotate(2deg)}}
.gma .pad{transform-origin:50% 100%;animation:padw .9s ease-in-out infinite alternate}
@keyframes padw{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.gma .geye{animation:blink 3.8s infinite}
.yarn{width:78%;height:0;border-radius:12px 12px 4px 4px;transition:height 1.4s cubic-bezier(.2,.9,.3,1);
  background:repeating-linear-gradient(135deg,var(--y1) 0 7px,var(--y2) 7px 14px),var(--y1);background-blend-mode:normal;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -6px 12px rgba(0,0,0,.25),0 0 18px color-mix(in srgb,var(--y1) 40%,transparent)}
.bcol .l{font-family:Unbounded,sans-serif;color:var(--g);font-weight:800;margin-top:6px}
.bcol.win .gma{animation:gwin .45s ease-in-out infinite}
@keyframes gwin{50%{transform:translateY(-10px) rotate(-4deg)}}
.bcol.win .pc{color:#fde68a;text-shadow:0 0 12px rgba(251,191,36,.7)}
.needles{position:absolute;inset:auto}
.gquote{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.4}

/* ladder */
.rung{display:flex;justify-content:space-between;padding:8px 14px;border-radius:12px;font-weight:600;color:var(--mut);font-variant-numeric:tabular-nums}
.rung.safe{color:#fff;font-weight:800}
.rung.done{color:#86efac}
.rung.cur{background:linear-gradient(135deg,#fbbf24,#f97316);color:#1a0f00;font-weight:800}

/* start cards */
.namebox{background:linear-gradient(135deg,rgba(124,58,237,.28),rgba(34,211,238,.12));border:1px solid rgba(167,139,250,.45);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px}
.namebox label{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:#c4b5fd}
.namebox input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(7,5,26,.6);color:var(--txt);font:inherit;font-size:18px;font-weight:700;outline:none;transition:border-color .2s,box-shadow .2s}
.namebox input::placeholder{color:#6b6896;font-weight:600}
.namebox input:focus{border-color:#a78bfa;box-shadow:0 0 0 4px rgba(167,139,250,.25)}
.namebox.err input{border-color:#ef4444;animation:shk .4s}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fc{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;animation:ansIn .5s backwards}
.fc:nth-child(2){animation-delay:.08s}.fc:nth-child(3){animation-delay:.16s}.fc:nth-child(4){animation-delay:.24s}
.fc::after{content:"";position:absolute;right:-30px;top:-30px;width:80px;height:80px;border-radius:50%;background:var(--gl);opacity:.25;filter:blur(18px)}
.fc .fi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--gl)}
.fc b{font-family:Unbounded,sans-serif;font-size:15px;line-height:1.15}
.fc span{font-size:12.5px;color:var(--mut);line-height:1.3}
.vbar{display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 14px}
.vbar .vt{flex:1;font-weight:700;font-size:14.5px}
.vbar .vt small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.icobtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);font-size:18px;cursor:pointer}
/* mode switch */
.seg{display:flex;flex-direction:column;gap:8px}
.segl{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:#c4b5fd;padding-left:4px}
.segw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:rgba(7,5,26,.6);border:1px solid var(--line);border-radius:16px;padding:4px}
.segw button{border:0;border-radius:12px;padding:12px 8px;background:transparent;color:var(--mut);font-weight:800;font-size:15px;cursor:pointer;transition:all .25s}
.segw button.on{background:linear-gradient(135deg,var(--v),#db2777);color:#fff;box-shadow:0 6px 18px rgba(124,58,237,.4)}
/* chef */
.chef{opacity:0;transform:translateY(-14px);transition:opacity .4s,transform .4s cubic-bezier(.2,.9,.3,1.3)}
#host[data-style=smakosz] .chef{opacity:1;transform:none}
/* voice settings */
.vrow{display:flex;flex-direction:column;gap:6px}
.vrow label{font-size:13px;font-weight:700;color:var(--mut);display:flex;justify-content:space-between}
.vrow select{width:100%;padding:12px;border-radius:14px;background:#120b3d;color:var(--txt);border:1px solid var(--line);font:inherit;font-size:15px}
.vrow input[type=range]{width:100%;accent-color:#fbbf24}
.vnote{font-size:13px;color:var(--mut);line-height:1.45;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
/* fx */
.confetti{position:fixed;top:-16px;width:8px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.catw{position:absolute;width:86px;height:62px;z-index:35;pointer-events:none;transition:left 1.7s linear}
.catw svg{width:100%;height:100%;overflow:visible}
.catw svg *{transform-box:fill-box;transform-origin:50% 0%}
.catw.walk .l1,.catw.walk .l4{animation:legA .3s ease-in-out infinite alternate}
.catw.walk .l2,.catw.walk .l3{animation:legA .3s ease-in-out infinite alternate-reverse}
@keyframes legA{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.catw.walk .cwrap{animation:cbob .15s ease-in-out infinite alternate}
@keyframes cbob{to{transform:translateY(-2px)}}
.catw .ctail{transform-origin:100% 100%;animation:ctail 1s ease-in-out infinite alternate}
@keyframes ctail{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.catw .ceye{transform-origin:center;animation:blink 3s infinite}
.catw .cwrap{transition:transform .35s;transform-origin:30% 100%}
.catw.sit .cwrap{transform:rotate(-16deg) translateY(4px)}
.catw.sit .l1,.catw.sit .l2{transform:scaleY(.35)}
.catw.paw .l4{animation:paw .3s ease-in-out 4 alternate}
@keyframes paw{to{transform:rotate(-95deg)}}
.catw .cbub{position:absolute;left:44px;top:-30px;background:#fff;color:#1b1340;font-weight:800;font-size:12px;padding:4px 9px;border-radius:12px;opacity:0;transform:scale(.6);transition:all .25s;white-space:nowrap}
.catw.sit .cbub{opacity:1;transform:none}
.catw.out svg{transform:scaleX(1)}
.ans .pawmark{margin-left:auto;font-size:18px;animation:pawin .35s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pawin{from{transform:scale(0) rotate(-30deg)}}
.ans.pawed{border-color:#34d399;box-shadow:0 0 0 2px rgba(52,211,153,.5),0 0 20px rgba(52,211,153,.3)}
</style>
</head>

const G_LINES={"INSULTS": ["Pańska odpowiedź, drogi {I}, ma w sobie tyle sensu co pierogi bez farszu.", "Ach, cóż za katastrofa! To jak podać żurek w kieliszku do szampana. Baranie.", "Pański mózg, szanowny panie, przypomina kluskę śląską: dziurka jest, a w środku pusto.", "Doprawdy, {N}… To było jak schabowy panierowany w cukrze pudrze. Niejadalne.", "Ta odpowiedź pachnie mi bigosem przypalonym przy trzecim odgrzewaniu.", "Mój drogi, pańska wiedza jest jak zupka z proszku: dużo wody, zero smaku.", "Gdyby głupota była przyprawą, byłby pan najostrzejszą papryczką na targu, {N}.", "Odpowiedział pan tak, jakby ktoś wrzucił ananasa do rosołu. Zbrodnia, po prostu zbrodnia.", "Proszę pana, nawet kiszony ogórek ma więcej rozumu. A on całe życie siedzi w słoiku.", "To błąd, którego nie uratuje nawet masło. A masło ratuje wszystko.", "Zaserwował nam pan danie z pustej głowy, podane na zimno. Fe!", "{N}, pańska odpowiedź ma konsystencję rozgotowanego makaronu.", "Ależ to był zakalec, drogi {I}! Zakalec intelektualny pierwszej próby.", "Pan nie odpowiada, pan przypala. Jak jajecznicę na zbyt dużym ogniu, ciołku."], "PRAISE": ["Wyborna odpowiedź! Krucha jak dobre ciasto francuskie. Tylko się nie przyzwyczajaj, parówo.", "Proszę, proszę… Dojrzała odpowiedź, jak dobry ser. Szkoda, że pan sam jeszcze surowy.", "Trafione jak szczypta soli do pomidora. Brawo, {N}.", "Smakowite! Aż mi ślinka pociekła.", "Poprawnie. Jak kotlet mielony: nic wielkiego, ale syci.", "Wspaniale! Ta odpowiedź pachnie świeżym chlebem z masłem.", "No proszę, {I}! Dobrze wyważone, jak żurek u babci."], "ASK_FINAL": ["Ostateczna odpowiedź? Proszę się zastanowić, jak nad wyborem wina do pieczeni.", "Na pewno? Bo to danie może być ostre, {N}.", "Ostateczna? Widzę, że poci się pan jak pierogi na parze.", "Zaznacza pan to z odwagą człowieka, który je grzyby z nieznanego lasu.", "Ostateczna odpowiedź? Proszę pamiętać: raz przypalonego sosu się nie odratuje."], "ASK_Q": ["Kolejne danie z naszego menu: pytanie za {p}. Proszę smakować powoli.", "A teraz, moi drodzy, pytanie za {p}. Podane na ciepło.", "Za {p}. Pytanie pikantne jak chrzan do jajka.", "Pytanie za {p}. Aromatyczne, z nutą upokorzenia.", "Danie główne: pytanie za {p}. Proszę nie mlaskać, {N}."], "END_LOSE": ["Na tym kończymy naszą degustację. Był pan, drogi {I}, daniem wyjątkowo nieudanym.", "Wraca pan do domu z kwotą gwarantowaną i niesmakiem w ustach. Smacznego!", "Tyle z naszej uczty. Proszę wrócić, jak nauczy się pan czegoś więcej niż gotowania wody."]};


const $=id=>document.getElementById(id);

let actx;
function ac(){actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx}
let NOISE;
function noiseBuf(c){if(NOISE)return NOISE;const b=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NOISE=b}
function applause(dur=2.6,vol=1){
  try{
    const c=ac(),t0=c.currentTime,out=c.createGain();out.gain.value=.55*vol;out.connect(c.destination);
    // szum tła publiczności
    const bed=c.createBufferSource();bed.buffer=noiseBuf(c);bed.loop=true;
    const bf=c.createBiquadFilter();bf.type='bandpass';bf.frequency.value=1800;bf.Q.value=.6;
    const bg=c.createGain();bg.gain.setValueAtTime(0,t0);bg.gain.linearRampToValueAtTime(.18,t0+.25);bg.gain.setValueAtTime(.18,t0+dur*.6);bg.gain.linearRampToValueAtTime(0,t0+dur);
    bed.connect(bf);bf.connect(bg);bg.connect(out);bed.start(t0);bed.stop(t0+dur+.1);
    // pojedyncze klaśnięcia
    const n=Math.round(dur*55);
    for(let i=0;i<n;i++){
      const p=Math.random(),at=t0+(p<.85?p*dur*.75:p*dur);
      const s=c.createBufferSource();s.buffer=noiseBuf(c);
      const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900+Math.random()*1800;f.Q.value=1+Math.random()*2;
      const g=c.createGain();const fade=at>t0+dur*.6?Math.max(0,1-(at-t0-dur*.6)/(dur*.4)):1;
      g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime((.25+Math.random()*.35)*fade,at+.003);g.gain.exponentialRampToValueAtTime(.001,at+.03+Math.random()*.04);
      s.connect(f);f.connect(g);g.connect(out);s.start(at,Math.random()*1.5,.09);
    }
    // okrzyk „juhuu”
    const w=c.createOscillator(),wg=c.createGain(),wf=c.createBiquadFilter();w.type='sawtooth';wf.type='bandpass';wf.frequency.value=900;wf.Q.value=4;
    w.frequency.setValueAtTime(420,t0+.15);w.frequency.linearRampToValueAtTime(760,t0+.55);w.frequency.linearRampToValueAtTime(600,t0+.8);
    wg.gain.setValueAtTime(0,t0+.15);wg.gain.linearRampToValueAtTime(.05,t0+.25);wg.gain.linearRampToValueAtTime(0,t0+.85);
    w.connect(wf);wf.connect(wg);wg.connect(out);w.start(t0+.15);w.stop(t0+.9);
  }catch(e){}
}
function boo(dur=2.2){
  try{
    const c=ac(),t0=c.currentTime,out=c.createGain();out.gain.value=.5;out.connect(c.destination);
    const form=c.createBiquadFilter();form.type='lowpass';form.frequency.value=520;form.Q.value=3;form.connect(out);
    for(let v=0;v<9;v++){
      const st=t0+Math.random()*.35,en=t0+dur-Math.random()*.4;
      const o=c.createOscillator();o.type='sawtooth';const base=95+Math.random()*90;
      o.frequency.setValueAtTime(base*1.06,st);o.frequency.linearRampToValueAtTime(base,st+.3);o.frequency.linearRampToValueAtTime(base*.9,en);
      const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=4+Math.random()*3;lg.gain.value=base*.03;lfo.connect(lg);lg.connect(o.frequency);
      const g=c.createGain();g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(.09,st+.25);g.gain.setValueAtTime(.09,en-.4);g.gain.linearRampToValueAtTime(0,en);
      o.connect(g);g.connect(form);o.start(st);o.stop(en+.05);lfo.start(st);lfo.stop(en+.05);
    }
    const nz=c.createBufferSource();nz.buffer=noiseBuf(c);const nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=400;
    const ng=c.createGain();ng.gain.setValueAtTime(0,t0);ng.gain.linearRampToValueAtTime(.12,t0+.3);ng.gain.linearRampToValueAtTime(0,t0+dur);
    nz.connect(nf);nf.connect(ng);ng.connect(out);nz.start(t0);nz.stop(t0+dur);
  }catch(e){}
}
function beep(type){
  try{
    ac();
    const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);const t=actx.currentTime;
    if(type==='ok'){o.type='triangle';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+.1);o.frequency.setValueAtTime(784,t+.2)}
    else if(type==='bad'){o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.linearRampToValueAtTime(60,t+.6)}
    else if(type==='beat'){o.type='sine';o.frequency.setValueAtTime(70,t)}
    else{o.type='sine';o.frequency.setValueAtTime(880,t)}
    const d=type==='bad'?.7:type==='ok'?.45:.18;
    g.gain.setValueAtTime(type==='beat'?.4:.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.05);
  }catch(e){}
}
const MALE=/krzysztof|marek|jakub|adam|pawe|piotr|tomasz|micha|jan\b|grzegorz|andrzej|male|mężczyzna|man\b/i;

function allVoices(){try{return speechSynthesis.getVoices()||[]}catch(e){return []}}
function scoreVoice(v){let s=0;const l=(v.lang||'').toLowerCase();if(l.startsWith('pl'))s+=100;if(MALE.test(v.name))s+=20;if(QUALITY.test(v.name))s+=8;if(/google/i.test(v.name))s+=2;return s}
function bestVoice(){
  const vs=allVoices();if(VS.uri){const v=vs.find(v=>v.voiceURI===VS.uri);if(v)return v}
  return vs.slice().sort((a,b)=>scoreVoice(b)-scoreVoice(a))[0]||null;
}
function speak(text,force){return;
  if((!$('voice').checked&&!force)||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    const v=bestVoice();
    // showmańsko: zdanie po zdaniu, z lekką zmianą tonu i tempa
    const sm=VS.story!==false;const parts=text.replace(/…/g,'...').match(sm?/[^.!?,:]+[.!?,:]*\s*/g:/[^.!?]+[.!?]*\s*/g)||[text];
    parts.forEach(p=>{
      p=p.trim();if(!p)return;
      const u=new SpeechSynthesisUtterance(p);u.lang=v?v.lang:'pl-PL';if(v)u.voice=v;
      const ex=/!/.test(p),q=/\?/.test(p);
      u.pitch=Math.max(.1,Math.min(2,VS.pitch+(ex?.12:q?.08:0)+(Math.random()*.06-.03)));
      u.rate=Math.max(.5,Math.min(2,(VS.rate+(ex?.08:0))*(sm?.88:1)));if(sm)u.pitch=Math.max(.1,u.pitch-.05+(q?.1:0));
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

    const txt='🗣️ '+pick(PHONE).replaceAll('{X}',`${L[ans]}: ${q.a[ans]}`),plain=txt.replace(/<[^>]+>/g,'');
    let i=0;const tw=setInterval(()=>{i+=2;$('csay').textContent=plain.slice(0,i);if(i>=plain.length){clearInterval(tw);$('csay').innerHTML=txt}},22);
  },1900);
  $('hang').onclick=()=>{clearTimeout(t1);clearInterval(tm);closeSheet();say("Ufasz człowiekowi, który na weselu tańczył z krzesłem? Ty baranie.",'laugh')};
};
$('llBabcie').onclick=()=>{
  if(S.locked)return;$('llBabcie').disabled=true;
  const q=S.qs[S.i],vis=visible();
  const fav=Math.random()<acc(.85)?q.c:pick(vis.filter(k=>k!==q.c));
  const w={};vis.forEach(k=>w[k]=Math.random()*25+5);w[fav]+=40+Math.random()*25;
  const sum=Object.values(w).reduce((a,b)=>a+b,0),pct={};let tot=0;
  vis.forEach(k=>{pct[k]=Math.round(w[k]/sum*100);tot+=pct[k]});pct[fav]+=100-tot;
  const HAIR=['#e5e7eb','#c4b5fd','#93c5fd','#fde68a'],CARD=['#be185d','#0f766e','#b45309','#4338ca'],Y=[['#f472b6','#db2777'],['#2dd4bf','#0f766e'],['#fbbf24','#d97706'],['#a78bfa','#6d28d9']];
  const gma=k=>`<svg class="gma" viewBox="0 0 62 66" style="animation-delay:${-k*.4}s">
    <path d="M8 66 Q10 50 30 47 Q50 50 52 66Z" fill="${CARD[k]}"/><path d="M24 48 L30 57 L36 48Z" fill="#fff"/>
    <circle cx="30" cy="9" r="7" fill="${HAIR[k]}"/><circle cx="30" cy="28" r="17" fill="${HAIR[k]}"/>
    <ellipse cx="30" cy="31" rx="13" ry="15" fill="#f5d0b5"/>
    <path d="M16 25 Q20 12 30 13 Q40 12 44 25 Q38 18 30 19 Q22 18 16 25Z" fill="${HAIR[k]}"/>
    <g class="geye"><circle cx="24" cy="30" r="1.5" fill="#1b1340"/><circle cx="36" cy="30" r="1.5" fill="#1b1340"/></g>
    <g fill="none" stroke="#7c2d12" stroke-width="1.6"><circle cx="24" cy="30" r="4.6"/><circle cx="36" cy="30" r="4.6"/><path d="M28.6 30h2.8"/></g>
    <circle cx="20.5" cy="37" r="2.6" fill="#fb7185" opacity=".55"/><circle cx="39.5" cy="37" r="2.6" fill="#fb7185" opacity=".55"/>
    <path d="M26 40 Q30 43.5 34 40" stroke="#9f1239" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <g class="pad"><rect x="49" y="30" width="3" height="24" rx="1" fill="#a16207"/><rect x="42" y="14" width="17" height="17" rx="4" fill="#fff" stroke="#e5e7eb"/><text x="50.5" y="27" text-anchor="middle" font-family="Unbounded,Inter" font-size="11" font-weight="800" fill="#7c3aed">${L[k]}</text></g>
  </svg>`;
  const top=Math.max(...[0,1,2,3].map(k=>pct[k]||0));
  sheet(`<h2>Babcie z widowni głosują</h2>
   <div class="bars">${[0,1,2,3].map(k=>`<div class="bcol" data-v="${pct[k]||0}"><span class="pc">0%</span>${gma(k)}<div class="yarn" style="--y1:${Y[k][0]};--y2:${Y[k][1]}"></div><span class="l">${L[k]}</span></div>`).join('')}</div>
   <div class="gquote">🧶 ${pick(BABCIE)}</div><button class="btn wide" id="mOk">Dzięki, babcie</button>`);
  setTimeout(()=>{
    const cols=[...document.querySelectorAll('.bcol')];
    cols.forEach((c,i)=>{c.classList.add('go');c.querySelector('.yarn').style.height=(6+(+c.dataset.v)*1.45)+'px';c.querySelector('.yarn').style.transitionDelay=(i*.08)+'s'});
    const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1400),e=1-Math.pow(1-p,3);
      cols.forEach(c=>c.querySelector('.pc').textContent=Math.round(c.dataset.v*e)+'%');
      if(p<1)requestAnimationFrame(tk);else cols.forEach(c=>{if(+c.dataset.v===top&&top>0)c.classList.add('win')})})(t0);
  },120);
  $('mOk').onclick=()=>{closeSheet();say("Babcie wiedzą wszystko. Tylko czasem coś zupełnie innego, {N}.",'smug')};
};

$('llCat').onclick=()=>{
  if(S.locked)return;$('llCat').disabled=true;
  const q=S.qs[S.i],vis=visible(),k=Math.random()<.4?q.c:pick(vis),btn=btns()[k];
  btn.scrollIntoView({block:'center',behavior:'smooth'});

    setTimeout(()=>cat.remove(),5900);
  },350);
};

function closeSheet(){$('sheetBg').classList.remove('open')}

};
